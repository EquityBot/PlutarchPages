name: Coverage-guided fuzz

# libFuzzer runs of the untrusted-input parsers, weekly and on demand: stream decoding, indirect
# objects and content streams. fuzz.yml's mutation fuzzer drives whole documents; these targets
# let coverage feedback reach the parsers' rarer branches. A crash's input is uploaded.
on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

# The token is only used to check out the code: no job writes to the repository.
permissions:
  contents: read

concurrency:
  group: cargo-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.crate }} ${{ matrix.target }} (5 min)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: filters, target: decode }
          - { crate: cos, target: indirect }
          - { crate: content, target: round_trip }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and the pinned cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz for 5 minutes
        working-directory: crates/${{ matrix.crate }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- -max_total_time=300 -rss_limit_mb=4096
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
