name: Snyk

# Snyk cannot read Cargo.lock directly, so the graph is described as CycloneDX
# SBOMs and tested with `snyk sbom test`. It runs weekly and when a dependency
# file changes, which keeps it inside the free plan's monthly test allowance.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/snyk.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/snyk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Snyk Rust dependencies
    # Pull requests from forks, and Dependabot's (which get Dependabot secrets
    # only), receive no SNYK_TOKEN; the weekly run on main scans their changes.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      # The workspace's rust-version.
      - name: Install the SBOM generator
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
          cargo install cargo-cyclonedx --locked --version 0.5.9
      # cargo-cyclonedx writes one SBOM per workspace member. Together the apps'
      # and xtask's SBOMs list every third-party crate in the others' (checked
      # 1 November 2026), so only they are tested. `--target all` includes the
      # Windows and macOS crates the releases ship with.
      - name: Test the Cargo graph
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target all --override-filename snyk-sbom
          [ -n "$SNYK_TOKEN" ] || { echo "::error::The SNYK_TOKEN repository secret is not set, so nothing was scanned."; exit 1; }
          status=0
          for sbom in apps/*/snyk-sbom.json xtask/snyk-sbom.json; do
            snyk sbom test --experimental --file="$sbom" || status=1
          done
          exit "$status"
