# EquityBot_PlutarchPages uses SonarQube Cloud automatic analysis, which reads this file and not
# sonar-project.properties (the CI scanner's file). This file repeats that file's exclusion.

# vendor/ holds third-party crates carried with small, marked patches (vendor/README.md).
# Its 16 findings on 4 November 2026 were each reviewed and none applies: 9 MD5 uses and 4 zero
# IVs (wrapping the file key in /OE and /UE) are what ISO 32000 specifies, and stream encryption
# uses a random IV; hayro-interpret's SoftMask hashes and compares the same obj_id; winit's
# MaybeUninit array and its mem::forget of a raw Weak are the documented sound patterns.
sonar.exclusions=vendor/**

# S4790 (weak hash) in crates/crypt/src/lib.rs and crates/sign/src/keys.rs belongs in the
# project's Analysis Scope settings (Ignore Issues on Multiple Criteria), not here: automatic
# analysis ignored the multicriteria keys
# this file carried in #54 (the 7 findings stayed open after its 4 November 2026 analysis). MD5 is
# the hash ISO 32000 mandates for the RC4/AES-128 standard security handler, and RIPEMD-160 is a
# digest existing signatures may name; new signatures use SHA-256 or SHA-384.
