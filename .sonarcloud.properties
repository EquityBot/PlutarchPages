# EquityBot_PlutarchPages uses SonarQube Cloud automatic analysis, which reads this file and not
# sonar-project.properties (the CI scanner's file). These settings mirror that file.

# vendor/ holds third-party crates carried with small, marked patches (vendor/README.md).
# Its 16 findings on 4 November 2026 were each reviewed and none applies: 9 MD5 uses and 4 zero
# IVs (wrapping the file key in /OE and /UE) are what ISO 32000 specifies, and stream encryption
# uses a random IV; hayro-interpret's SoftMask hashes and compares the same obj_id; winit's
# MaybeUninit array and its mem::forget of a raw Weak are the documented sound patterns.
sonar.exclusions=vendor/**

# S4790 (weak hash): MD5 is the hash ISO 32000 mandates for the RC4/AES-128 standard security
# handler, and RIPEMD-160 is a digest existing signatures may name. Both are needed to open and
# verify existing files, not chosen for new security.
sonar.issue.ignore.multicriteria=crypt_md5,sign_ripemd
sonar.issue.ignore.multicriteria.crypt_md5.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.crypt_md5.resourceKey=crates/crypt/src/lib.rs
sonar.issue.ignore.multicriteria.sign_ripemd.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.sign_ripemd.resourceKey=crates/sign/src/keys.rs
