[package]
name = "pdfcraft-cos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Detached from the PdfCraft workspace: run with `cargo +nightly fuzz run indirect`
# from crates/cos/.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pdfcraft-cos = { path = ".." }

[[bin]]
name = "indirect"
path = "fuzz_targets/indirect.rs"
test = false
doc = false
bench = false
